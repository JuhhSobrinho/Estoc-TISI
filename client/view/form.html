<h2>Formulário de Requisição</h2>
<div class="card card-body">
    <div class="card-header bg-primary text-white">
        Requisição de Materiais
    </div>

    <!-- Solicitante -->
    <!-- Cabeçalho da requisição -->
    <div class="d-flex gap-3 mb-3 border p-3 rounded align-items-end flex-wrap">
        <!-- Nome da Requisição -->
        <div class="mb-3">
            <label for="nomeRequisicao" class="form-label">Nome da
                Requisição</label>
            <input type="text" class="form-control" id="nomeRequisicao"
                placeholder="Ex: Req/Base">
        </div>

        <!-- Solicitante -->
        <div class="mb-3">
            <label for="solicitante" class="form-label">Solicitante</label>
            <input type="text" class="form-control" id="solicitante"
                placeholder="Ex: João Silva">
        </div>

        <!-- Data da Requisição -->
        <div class="mb-3">
            <label for="dataRequisicao" class="form-label">Data da
                Requisição</label>
            <input type="date" class="form-control" id="dataRequisicao">
        </div>

        <!-- Origem -->
        <div class="mb-3">
            <label for="origem" class="form-label">Plataforma de Origem</label>
            <select class="form-select" id="origem">
                <option value="BASE">Selecione</option>
                <option value="BASE">BASE</option>
                <option value="P-62">P-62</option>
                <option value="P-72">P-72</option>
                <option value="P-74">P-74</option>
                <option value="P-75">P-75</option>
                <option value="P-77">P-77</option>
            </select>
        </div>

        <!-- Destino -->
        <div class="mb-3">
            <label for="destino" class="form-label">Plataforma de
                Destino</label>
            <select class="form-select" id="destino">
                <option value>Selecione</option>
                <option value="BASE">Base</option>
                <option value="P-62">P-62</option>
                <option value="P-72">P-72</option>
                <option value="P-74">P-74</option>
                <option value="P-75">P-75</option>
                <option value="P-77">P-77</option>
            </select>
        </div>
    </div>

    <!-- Observações -->
    <div class="mb-3">
        <label for="observacoes" class="form-label">Observações</label>
        <textarea class="form-control" id="observacoes" rows="2"
            placeholder="Informações adicionais sobre a requisição..."></textarea>
    </div>

    <hr>

    <!-- Lista de materiais -->
    <div id="listaMateriais">
        <div
            class="material-item d-flex gap-3 mb-3 border p-3 rounded align-items-end flex-wrap">
            <div>
                <label class="form-label">Material</label>
                <select class="form-select" name="material[]">
                    <option value>Selecione</option>
                    <option value="Resina ht A">Selecione a Plataforma de Origem</option>
                </select>
            </div>

            <div>
                <label class="form-label">Kardex</label>
                <input type="text" class="form-control" name="kardex[]"
                    placeholder="Ex: 321123">
            </div>

            <div>
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" name="quantidade[]"
                    placeholder="Ex: 10">
            </div>

            <div>
                <label class="form-label">Validade</label>
                <input type="date" class="form-control" name="validade[]"
                    readonly>
            </div>

            <div>
                <button type="button" class="btn btn-sm btn-danger mt-4"
                    onclick="this.closest('.material-item').remove()">Remover</button>
            </div>
        </div>

    </div>

    <!-- Botão para adicionar mais materiais -->
    <button type="button" class="btn btn-outline-success mb-3"
        id="btnAdicionarMaterial">+ Adicionar Material</button>
    <!-- Botão para confirmar/salvar a requisição -->
    <div class="text-end">
        <button type="button" class="btn btn-primary" id="btnSalvarRequisicao">
            Confirmar Requisição
        </button>
    </div>

</div>
